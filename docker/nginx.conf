worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No access analytics or URL/query-string access logs.
    access_log off;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1k;

    # All runtime writes stay in /tmp, including with a read-only rootfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map "$status:$uri" $cache_control {
        default "no-store";
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $cache_control always;

        # No upload, proxy, screenshot service, or other server-side API.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Hosting-provider directives are not public application assets.
        location ~ (^|/)\. {
            return 404;
        }
        location ~ ^/(?:_headers|_redirects)(?:/|$) {
            return 404;
        }

        # Real multilingual HTML files are generated during the build.
        # Missing JS/assets must return 404 rather than the editor HTML.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
